name: Build AniVault Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.kt'
      - '**/*.cpp'
      - '**/*.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'modules/**'
      - '.github/workflows/android-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID || '1505538731791093820' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PdiscordApplicationId="$DISCORD_APPLICATION_ID" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniVault-Android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
