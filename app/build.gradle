plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'co.anivault.app'
    compileSdk 35
    defaultConfig {
        applicationId 'co.anivault.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    buildFeatures { buildConfig true; prefab true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation files('../modules/anivault-discord-presence/android/discord_partner_sdk.aar')
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
